services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    expose:
      - "3001"
    volumes:
      - bot-data:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /data
      DRY_RUN: ${DRY_RUN:-true}
      CAPITAL_USD: ${CAPITAL_USD:-50}
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:-}
      ARBITRAGE_ENABLED: ${ARBITRAGE_ENABLED:-false}
      DIPARB_ENABLED: ${DIPARB_ENABLED:-false}
      SMARTMONEY_ENABLED: ${SMARTMONEY_ENABLED:-false}
      TREND_ANALYSIS_ENABLED: ${TREND_ANALYSIS_ENABLED:-false}
      PREDICTION_HUNT_API_KEY: ${PREDICTION_HUNT_API_KEY:-}
      PREDICTION_HUNT_API_URL: ${PREDICTION_HUNT_API_URL:-https://www.predictionhunt.com/api/v2}
      PREDICTION_HUNT_ENABLED: ${PREDICTION_HUNT_ENABLED:-true}
      PREDICTION_HUNT_POLL_MS: ${PREDICTION_HUNT_POLL_MS:-900000}
      PREDICTION_HUNT_ARB_MIN_ROI: ${PREDICTION_HUNT_ARB_MIN_ROI:-0.5}
      PREDICTION_HUNT_EV_MIN_ROI: ${PREDICTION_HUNT_EV_MIN_ROI:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  bot-data:
